[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qcoc"
version = "0.1.0"
description = "Per-head QCOC operator compression for key-value attention memories."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["jax"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
