[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "forte-keyframes"
version = "0.1.0"
description = "Training-free keyframe selector: GP relevance scoring plus exact logarithmic-coverage optimization."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "jax",
  "numpy",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
