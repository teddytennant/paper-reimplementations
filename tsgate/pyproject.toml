[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tsgate"
version = "0.1.0"
description = "Timestep-aware gated attention"
requires-python = ">=3.10"
dependencies = ["jax", "numpy"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
