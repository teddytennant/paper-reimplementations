[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tgg"
version = "0.1.0"
description = "Gaussian graphical model tests for long-memory time series"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "jax",
    "numpy",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.hatch.build.targets.wheel]
packages = ["src/tgg"]

[tool.hatch.build.targets.wheel.sources]
"src/tgg" = "tgg"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
