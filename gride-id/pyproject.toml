[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gride-id"
version = "0.1.0"
description = "Closed-form Gride intrinsic-dimension estimator"
requires-python = ">=3.10"
dependencies = [
    "jax",
    "numpy",
    "scipy",
]

[project.optional-dependencies]
tests = ["pytest"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
