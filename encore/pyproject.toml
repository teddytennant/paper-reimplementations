[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "encore"
version = "0.1.0"
description = "JAX implementation of ENCORE, exact non-equilibrium control with replica exchange (arXiv:2610.02538)"
requires-python = ">=3.10"
dependencies = [
    "jax",
    "numpy",
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
