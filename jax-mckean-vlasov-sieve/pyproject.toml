[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mkv-sieve"
version = "0.1.0"
description = "ReQU sieve MLE for density-dependent McKean-Vlasov diffusions (arXiv:2609.01166)"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Teddy Tennant", email = "teddytennant@icloud.com" }]
requires-python = ">=3.10"
dependencies = [
  "jax>=0.4.30",
  "optax>=0.2.2",
  "numpy>=1.26",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/mkv_sieve"]

[tool.pytest.ini_options]
testpaths = ["tests"]
