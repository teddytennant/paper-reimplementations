[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anchor-judge-rho"
version = "0.1.0"
description = "Closed-form estimator of LLM-judge anchor contamination ρ (arXiv:2609.08826)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Teddy Tennant", email = "teddytennant@icloud.com"}]
dependencies = ["jax>=0.4", "jaxlib>=0.4"]

[project.optional-dependencies]
tests = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
norecursedirs = [".venv", "src", "dist", "build"]
