[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sparse-decoding"
version = "0.1.0"
description = "Decode-time calibration, OBS N:M pruning, and bitmask SpMV."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["jax", "numpy"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
