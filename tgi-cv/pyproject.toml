[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tgi_cv"
version = "0.1.0"
description = "Transformed Gaussian incremental samplers with Hermite control variates"
requires-python = ">=3.10"
dependencies = [
  "jax",
  "jaxlib",
  "optax",
  "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
