[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dsle"
version = "0.1.0"
description = "Direct Spectral Laplacian Estimation from effective resistance"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Teddy Tennant"}]
dependencies = [
    "jax",
    "numpy",
]

[project.optional-dependencies]
tests = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
