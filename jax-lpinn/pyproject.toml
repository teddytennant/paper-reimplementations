[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jax-lpinn"
version = "0.1.0"
description = "JAX implementation of lPINN: pretrained neural basis, online last-layer residual least squares (arXiv:2609.14926)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Teddy Tennant", email = "teddytennant@icloud.com" }]
dependencies = [
  "jax>=0.11",
  "numpy",
]

[project.optional-dependencies]
tests = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
