[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jax-head-complexity"
version = "0.1.0"
description = "Constructions from 'The Head Complexity of Boolean Functions in Single-Layer Attention' (arXiv:2609.04046)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = ["jax>=0.4.30", "numpy>=1.26"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools]
packages = ["head_complexity"]
