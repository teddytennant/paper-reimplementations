[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sgdr"
version = "0.1.0"
description = "Semantic-Geometric Decoupled Routing for block-sparse attention"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["jax", "numpy"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
