[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fiona"
version = "0.1.0"
description = "Packing-aware ternary weight routing and exact linear-operator compilation"
requires-python = ">=3.10"
dependencies = [
    "jax",
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
