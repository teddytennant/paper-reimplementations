[project]
name = "jax-head-influence-score"
version = "0.1.0"
description = "Attention-head influence score (arXiv:2609.05074) in JAX"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "jax==0.11.1",
    "optax==0.2.8",
    "numpy==2.5.2",
]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["head_influence*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
