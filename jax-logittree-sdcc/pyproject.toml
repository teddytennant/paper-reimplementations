[project]
name = "memorywalker"
version = "0.1.0"
description = "Tree-structured training targets for rollouts under context compression, in JAX"
requires-python = ">=3.10"
dependencies = ["jax>=0.4.30", "optax>=0.2.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["memorywalker"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
