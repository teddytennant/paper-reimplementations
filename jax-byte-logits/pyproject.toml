[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jax-byte-logits"
version = "0.1.0"
description = "JAX token-logit to byte-logit conversion (arXiv:2609.12303)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Teddy Tennant", email = "teddytennant@icloud.com"}]
dependencies = ["jax>=0.4", "jaxlib>=0.4", "numpy>=1.24"]

[project.optional-dependencies]
tests = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
