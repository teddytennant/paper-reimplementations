[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jax-ugtl"
version = "0.1.0"
description = "JAX implementation of UGTL and the algorithm-dependent learnability bounds from arXiv:2609.01493"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Teddy Tennant", email = "teddytennant@icloud.com" }]
dependencies = [
    "jax>=0.4.30",
    "optax>=0.2.2",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["ugtl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
