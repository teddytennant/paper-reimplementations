[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hbds-sbi"
version = "0.1.0"
description = "Small JAX check of compositional diffusion SBI from arXiv 2609.36950"
requires-python = ">=3.10"
dependencies = [
  "jax",
  "numpy",
  "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
