[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "psagml"
version = "0.1.0"
description = "PSA-GML (arXiv:2609.29150) JAX kernel for joint precoding and STAR-RIS coefficients"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Teddy Tennant", email = "teddytennant@icloud.com"}]
dependencies = ["jax>=0.4.30", "numpy"]

[project.optional-dependencies]
dev = ["pytest>=7"]
tests = ["pytest>=7"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
