[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pointlam"
version = "0.1.0"
description = "PointLAM kernels: Laplacian Point Sampler and Local Hadamard Aggregator (arXiv:2609.21780)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Teddy Tennant", email = "teddytennant@icloud.com"}]
dependencies = ["jax>=0.11", "jaxlib", "numpy"]

[project.optional-dependencies]
tests = ["pytest>=7"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
