[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "jax-msvr"
version = "0.1.0"
description = "JAX kernel of Multi-block-Single-probe Variance Reduction for FCCO (arXiv:2609.15723)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Teddy Tennant", email = "teddytennant@icloud.com"}]
dependencies = ["jax>=0.4.30", "jaxlib>=0.4.30", "numpy"]
[project.optional-dependencies]
dev = ["pytest>=7"]
tests = ["pytest>=7"]
[tool.setuptools.package-dir]
"" = "src"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
