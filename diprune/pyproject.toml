[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "diprune"
version = "0.1.0"
description = "Training-free dual importance pruning of visual tokens"
requires-python = ">=3.10"
dependencies = [
  "jax",
  "numpy",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["diprune*"]

[tool.pytest.ini_options]
pythonpath = ["."]
