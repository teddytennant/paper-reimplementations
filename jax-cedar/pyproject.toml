[project]
name = "jax-cedar"
version = "0.1.0"
description = "JAX implementation of CEDAR residual summary routing for sparse attention"
authors = [{ name = "Teddy Tennant", email = "teddytennant@icloud.com" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "jax>=0.4.30",
    "numpy>=1.26",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
