[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jax-3dpcs"
version = "0.1.0"
description = "JAX 3D point-cloud splatting (3DPCS) kernel from PRI-Net (arXiv:2609.14469)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Teddy Tennant", email = "teddytennant@icloud.com"}]
dependencies = [
    "jax",
    "jaxlib",
    "numpy",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.urls]
Paper = "https://arxiv.org/abs/2609.14469"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
