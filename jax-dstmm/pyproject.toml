[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jax-dstmm"
version = "0.1.0"
description = "JAX implementation of deep skew-t mixture models (arXiv:2609.00773)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Teddy Tennant", email = "teddytennant@icloud.com" }]
dependencies = ["jax>=0.4.30", "numpy>=1.26"]

[project.optional-dependencies]
test = ["pytest", "scipy>=1.11"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
