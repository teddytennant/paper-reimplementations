[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ncl-mct"
version = "0.1.0"
description = "JAX kernel of the NCL-MCT integrator and known-law constitutive supervision"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "jax",
    "equinox",
    "optax",
    "numpy",
]

[project.optional-dependencies]
tests = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
