[project]
name = "jax-token-geometry"
version = "0.1.0"
description = "Numerical instantiation of the token-prediction representation geometry theorems of arXiv:2608.30072"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Teddy Tennant", email = "teddytennant@icloud.com" }]
requires-python = ">=3.10"
dependencies = ["jax>=0.4.30", "optax>=0.2.0", "numpy>=1.26"]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tokengeom"]

[tool.pytest.ini_options]
testpaths = ["tests"]
