[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "masa"
version = "0.1.0"
description = "Matrix Approximation Sparse Attention scores"
requires-python = ">=3.10"
dependencies = ["jax"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
