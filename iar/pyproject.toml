[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "iar"
version = "0.1.0"
description = "One-atom Iterative Atom Refinement for dictionary learning"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Teddy Tennant"}]
dependencies = [
    "jax",
    "numpy",
]

[project.optional-dependencies]
tests = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
