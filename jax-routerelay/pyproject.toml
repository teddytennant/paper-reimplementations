[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jax-routerelay"
version = "0.1.0"
description = "Event-triggered cross-layer route reuse for dynamic sparse attention"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Teddy Tennant", email = "teddytennant@icloud.com" }]
dependencies = ["jax>=0.4.30", "numpy>=1.26"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
