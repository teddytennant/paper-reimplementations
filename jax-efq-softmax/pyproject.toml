[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jax-efq-softmax"
version = "0.1.0"
description = "JAX implementation of EFQ-Softmax: Exp-Free Quantization for Softmax"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Teddy Tennant", email = "teddytennant@icloud.com"}]
dependencies = ["jax>=0.4.30", "jaxlib>=0.4.30"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
