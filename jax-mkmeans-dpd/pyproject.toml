[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jax-mkmeans-dpd"
version = "0.1.0"
description = "JAX implementation of MK-means DPD and DC-MK-means DPD (arXiv:2608.30093)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Teddy Tennant", email = "teddytennant@icloud.com" }]
dependencies = ["jax>=0.4.30", "numpy>=1.24"]

[tool.hatch.build.targets.wheel]
packages = ["mkmeans_dpd"]

[tool.hatch.build.targets.wheel.force-include]
"mkmeans_dpd/iris.csv" = "mkmeans_dpd/iris.csv"
