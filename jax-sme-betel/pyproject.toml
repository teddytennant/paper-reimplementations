[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jax-sme-betel"
version = "0.1.0"
description = "JAX implementation of SME-BETEL, score matching moment conditions inside Bayesian exponentially tilted empirical likelihood"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Teddy Tennant", email = "teddytennant@icloud.com" }]
dependencies = [
    "jax==0.11.1",
    "numpy==2.5.2",
    "scipy==1.18.1",
]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[tool.setuptools.packages.find]
include = ["sme_betel*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
