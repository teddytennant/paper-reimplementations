[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jax-fcx"
version = "0.1.0"
description = "JAX implementation of FCx (Feasible Counterfactual Explanations), arXiv:2609.19383"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Teddy Tennant", email = "teddytennant@icloud.com"}]
dependencies = ["jax>=0.11", "jaxlib>=0.11", "numpy"]

[project.optional-dependencies]
dev = ["pytest>=7"]
tests = ["pytest>=7"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
