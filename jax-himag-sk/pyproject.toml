[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "himag"
version = "0.1.0"
description = "Down-up walk for fixed-magnetization Sherrington–Kirkpatrick models"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Teddy Tennant", email = "teddytennant@icloud.com" }]
dependencies = [
    "jax>=0.4.30",
    "jaxlib>=0.4.30",
    "numpy",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
