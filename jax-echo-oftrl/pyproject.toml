[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jax-echo-oftrl"
version = "0.1.0"
description = "ECHO-OFTRL: OFTRL with an EMA cascade for high-order optimism, in JAX"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Teddy Tennant", email = "teddytennant@icloud.com" }]
requires-python = ">=3.10"
dependencies = ["jax>=0.4.30", "jaxlib>=0.4.30", "numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8", "scipy>=1.11"]

[tool.setuptools]
packages = ["echo_oftrl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
