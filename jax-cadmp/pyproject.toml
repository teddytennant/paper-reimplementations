[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jax-cadmp"
version = "0.1.0"
description = "JAX implementation of CADMP, cross-modal attention drift and mask-based verification for object hallucination detection"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Teddy Tennant", email = "teddytennant@icloud.com" }]
dependencies = [
    "jax>=0.4.30",
    "optax>=0.2.2",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "scipy>=1.11",
]

[tool.hatch.build.targets.wheel]
packages = ["cadmp"]
