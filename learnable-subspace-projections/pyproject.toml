[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "learnable-subspace-projections"
version = "0.1.0"
description = "Orthogonal projectors on frozen linear layers, whitened SVD init, and low-rank merge."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jax",
    "equinox",
    "optax",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
