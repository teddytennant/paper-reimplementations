[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jax-me-decoding"
version = "0.1.0"
description = "JAX kernel of Mahalanobis-Ensemble Decoding (ME-Decoding) from arXiv:2609.18723"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Teddy Tennant", email = "teddytennant@icloud.com"}]
dependencies = ["jax>=0.4.30", "jaxlib>=0.4.30", "numpy"]

[project.optional-dependencies]
dev = ["pytest>=7"]
tests = ["pytest>=7"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
