[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "time-delay-system"
version = "0.1.0"
description = "JAX implementation of a time-delay sequence model with a semantic lag estimator and a diagonal state (arXiv:2610.12864)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["jax>=0.4"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
