[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jax-pdeg"
version = "0.1.0"
description = "JAX implementation of single-loop projected damped extragradient for smooth nonconvex-concave minimax problems (arXiv:2609.17973)."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Teddy Tennant", email = "teddytennant@icloud.com"},
]
dependencies = [
    "jax>=0.11",
    "numpy",
]

[project.optional-dependencies]
tests = ["pytest>=7"]

[project.urls]
Paper = "https://arxiv.org/abs/2609.17973"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
