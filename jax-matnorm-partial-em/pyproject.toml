[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "matnorm-pem"
version = "0.1.0"
description = "Partial EM for matrix-variate normal mixtures with element-wise and structural missingness"
requires-python = ">=3.10"
dependencies = ["jax>=0.4", "numpy>=1.24"]

[tool.setuptools.packages.find]
where = ["src"]
