[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jax-bota"
version = "0.1.0"
description = "JAX kernel of Branched Optimal Transport Amortization (arXiv:2609.15072)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Teddy Tennant", email = "teddytennant@icloud.com"}]
dependencies = [
    "jax>=0.4.30",
    "jaxlib>=0.4.30",
    "numpy",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
tests = ["pytest>=7"]

[project.urls]
Paper = "https://arxiv.org/abs/2609.15072"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
