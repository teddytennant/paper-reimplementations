[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lazy-so"
version = "0.1.0"
description = "JAX implementation of lazy second-order convex optimization from arXiv 2610.03222"
requires-python = ">=3.10"
dependencies = [
    "jax",
    "numpy",
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
