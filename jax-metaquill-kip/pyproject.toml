[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jax-metaquill-kip"
version = "0.1.0"
description = "NTK-KIP, MetaQuill and MetaQuill-KIP for neural fields, in JAX"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Teddy Tennant", email = "teddytennant@icloud.com" }]
requires-python = ">=3.10"
dependencies = ["jax>=0.4.30", "numpy>=1.26", "optax>=0.2.2"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools]
packages = ["metaquill_kip"]
