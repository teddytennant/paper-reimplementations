[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jax-maskcode"
version = "0.1.0"
description = "JAX implementation of MaskCode (arXiv:2609.00715)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Teddy Tennant", email = "teddytennant@icloud.com" }]
requires-python = ">=3.10"
dependencies = [
    "jax>=0.4.30",
    "jaxlib>=0.4.30",
    "numpy>=1.24",
    "equinox>=0.11",
    "optax>=0.2",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
include = ["maskcode*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
