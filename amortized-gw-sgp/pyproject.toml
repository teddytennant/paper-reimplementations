[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gwsgp"
version = "0.1.0"
description = "Amortized Gromov-Wasserstein matching for supervised graph prediction (arXiv 2609.15437)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Teddy Tennant", email = "teddytennant@icloud.com"}]
dependencies = [
    "jax>=0.4.30",
    "jaxlib>=0.4.30",
    "numpy",
]

[project.optional-dependencies]
dev = ["pytest"]
tests = ["pytest"]

[project.urls]
Paper = "https://arxiv.org/abs/2609.15437"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
