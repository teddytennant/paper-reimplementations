[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jax-svgcn"
version = "0.1.0"
description = "JAX implementation of SV-GCN (arXiv:2609.11680)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["jax>=0.4.30", "jaxlib>=0.4.30"]

[project.optional-dependencies]
dev = ["pytest"]
tests = ["pytest"]

[project.urls]
Paper = "https://arxiv.org/abs/2609.11680"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
