[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jax-osw-ft"
version = "0.1.0"
description = "JAX implementation of Online Self-Weighted Fine-Tuning (arXiv:2609.00734)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Teddy Tennant", email = "teddytennant@icloud.com" }]
dependencies = [
    "jax==0.11.1",
    "jaxlib==0.11.1",
    "optax==0.2.8",
    "numpy==2.5.2",
]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[tool.hatch.build.targets.wheel]
packages = ["src/osw_ft"]

[tool.pytest.ini_options]
testpaths = ["tests"]
