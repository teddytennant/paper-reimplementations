[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dags"
version = "0.1.0"
description = "Control equations for disentangled appearance-and-geometry steering"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "jax",
    "numpy",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.hatch.build.targets.wheel]
packages = ["src/dags"]

[tool.pytest.ini_options]
pythonpath = ["src"]
